applications:
  #Application
  - name: Crowd-Schedule
    path: deployment/
    buildpacks:
      - nodejs_buildpack
    memory: 256M
    command: node dist/index.js
    routes:
      - route: sv-demo-internal.cfapps.us10-001.hana.ondemand.com
    services:
      - my-xsuaa
      - my-destination-internal
  #Approuter      
  - name: Crowd-Schedule-Approuter
    path: approuter
    routes:
      - route: approuter-sv-demo-internal.cfapps.us10-001.hana.ondemand.com
    memory: 128M
    buildpacks:
      - nodejs_buildpack
    services:
      - my-xsuaa
    env:
      destinations: >
        [
          {
            "name":"svdemo-dest-internal",
            "url":"https://sv-demo-internal.cfapps.us10-001.hana.ondemand.com",
            "forwardAuthToken": true
          }
        ]
